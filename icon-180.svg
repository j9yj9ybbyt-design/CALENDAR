
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17234f"/>
      <stop offset="0.55" stop-color="#101b3c"/>
      <stop offset="1" stop-color="#07142d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd8ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42d4ff"/>
      <stop offset="0.55" stop-color="#2685ff"/>
      <stop offset="1" stop-color="#4542e9"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a44dff"/>
      <stop offset="1" stop-color="#32c9ff"/>
    </linearGradient>
    <linearGradient id="calendar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a8c8ff"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="9"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="#7189ff" stroke-opacity=".22" stroke-width="5"/>

  <ellipse cx="268" cy="419" rx="190" ry="25" fill="#02091e" opacity=".45"/>

  <g filter="url(#shadow)">
    <path d="M75 65 H204 L281 143 V365 Q281 382 264 382 H75 Q59 382 59 365 V82 Q59 65 75 65Z" fill="url(#paper)"/>
    <path d="M204 65 V127 Q204 143 220 143 H281Z" fill="#a8bdf3"/>
    <path d="M204 65 V126 Q204 143 220 143 H281" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="3"/>

    <rect x="91" y="160" width="128" height="64" rx="13" fill="#ed4050"/>
    <text x="155" y="203" fill="white" font-size="35" font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">PDF</text>

    <rect x="91" y="247" width="128" height="75" rx="13" fill="#168b58"/>
    <path d="M91 260 Q91 247 104 247 H206 Q219 247 219 260 V309 Q219 322 206 322 H104 Q91 322 91 309Z" fill="#178c58"/>
    <text x="155" y="300" fill="white" font-size="46" font-family="Arial,sans-serif" font-weight="800" text-anchor="middle">X</text>
    <path d="M181 247 H206 Q219 247 219 260 V309 Q219 322 206 322 H181Z" fill="#ffffff" opacity=".09"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="284" y="207" width="179" height="192" rx="23" fill="#123d91"/>
    <rect x="291" y="198" width="170" height="189" rx="22" fill="url(#blue)"/>
    <rect x="300" y="213" width="153" height="164" rx="14" fill="#f3f6ff"/>

    <rect x="325" y="194" width="17" height="49" rx="8.5" fill="#b9c9f8"/>
    <rect x="402" y="194" width="17" height="49" rx="8.5" fill="#b9c9f8"/>
    <rect x="329" y="196" width="9" height="40" rx="4.5" fill="#ffffff"/>
    <rect x="406" y="196" width="9" height="40" rx="4.5" fill="#ffffff"/>

    <g fill="#819ff0">
      <rect x="318" y="257" width="30" height="30" rx="7"/>
      <rect x="360" y="257" width="30" height="30" rx="7"/>
      <rect x="402" y="257" width="30" height="30" rx="7"/>
      <rect x="318" y="301" width="30" height="30" rx="7"/>
      <rect x="360" y="301" width="30" height="30" rx="7"/>
    </g>
    <rect x="402" y="301" width="30" height="30" rx="7" fill="#a04dff" filter="url(#glow)"/>
    <rect x="318" y="345" width="30" height="19" rx="6" fill="#b1c6fa"/>
    <rect x="360" y="345" width="30" height="19" rx="6" fill="#b1c6fa"/>
    <rect x="402" y="345" width="30" height="19" rx="6" fill="#b1c6fa"/>
  </g>

  <g filter="url(#glow)">
    <path d="M183 296 L253 296 L253 270 L326 325 L253 380 L253 354 L183 354Z" fill="url(#purple)" stroke="#a9baff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <path d="M194 305 H245" stroke="#ffffff" stroke-opacity=".65" stroke-width="4" stroke-linecap="round"/>

  <path d="M72 424 Q256 463 440 424" fill="none" stroke="#427bff" stroke-opacity=".15" stroke-width="3"/>
</svg>
